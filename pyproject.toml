[project]
name = "jarvis"
version = "0.1.0"
description = "Локальный AI-агент «Джарвис»"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "tree-sitter",
    "tree-sitter-language-pack",
    "python-dotenv",
    "rich",
    "structlog",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
